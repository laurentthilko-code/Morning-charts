name: Update morning charts

on:
  schedule:
    # 04:30 UTC = 06:30 CEST (summer) / 05:30 CET (winter) — before the 07:00
    # Brussels morning brief either way. Runs Mon–Fri.
    - cron: "30 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate charts
        run: python update_graphs.py

      - name: Commit and push updated charts
        run: |
          git config user.name "morning-charts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold_chart.png uranium_stocks.png quantum_stocks.png status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update charts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
