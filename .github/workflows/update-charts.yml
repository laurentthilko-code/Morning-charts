name: Update morning charts

on:
  schedule:
    # Run shortly after US market close (~30 min buffer) instead of before
    # the open, so the charts capture the full trading day instead of
    # missing it. Two entries to stay pinned to ~22:30 Brussels local
    # across the DST transition (Apr–Oct vs Nov–Mar):
    # 20:30 UTC = 22:30 CEST (summer) = 16:30 EDT (30 min after 16:00 ET close)
    - cron: "30 20 * 4-10 1-5"
    # 21:30 UTC = 22:30 CET (winter) = 16:30 EST (30 min after 16:00 ET close)
    - cron: "30 21 * 1-3,11-12 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate charts
        run: python update_graphs.py

      - name: Commit and push updated charts
        run: |
          git config user.name "morning-charts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold_chart.png uranium_stocks.png quantum_stocks.png status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update charts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
